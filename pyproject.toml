[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "typingdrill"
version = "0.1.0"
description = "离线英文打字练习：内置课程、自定义文本与单文件 HTML"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "eastyou" }]
keywords = ["education", "typing", "keyboard", "offline", "html", "cli"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Environment :: Console",
  "Topic :: Education",
]

[project.scripts]
typingdrill = "typingdrill.cli:main"

[project.urls]
Homepage = "https://github.com/eastyou/typingdrill"
Source = "https://github.com/eastyou/typingdrill"

[tool.setuptools]
packages = ["typingdrill"]
